name: release

on:
  push:
    tags:
      - 'v*'
  # 手动触发，用于补发某个 tag 的 release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v2.2.0'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 23.11.0
          # setup-node v5 会根据 package.json 的 packageManager 自动启用 pnpm 缓存，
          # 但该 job 未安装 pnpm，需关闭
          package-manager-cache: false

      # 手动触发时 github.ref_name 是分支名，changelogithub 会因其不是 tag 而跳过并报错，因此显式指定 tag
      - run: npx changelogithub --to "$RELEASE_TAG"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
